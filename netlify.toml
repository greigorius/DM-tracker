  status = 200

[[redirects]]
  from   = "/api/drawings-register"
  to     = "/.netlify/functions/drawings-register"
  status = 200

# ── SPA fallback ──────────────────────────────────────────────────────────────
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
