[build]
  command = "npm run build"
  publish = "dist"

[functions]
  node_bundler = "esbuild"

# Hub functions declare their own paths (config.path), so no API redirects:
#   api-read              GET   /api/snapshot, /api/bootstrap
#   api-write             POST  /api/actions, /api/rfis, /api/variations, /api/sync-now,
#                               /api/records/:db/:id/trash|restore
#                         PATCH /api/items/:id, /api/records/:db/:id
#                         POST  /api/team/email/preview|send, /api/item-bic/apply
#                         POST  /api/meetings, /api/suppliers, /api/todo/:id/to-action, /api/item-status/apply
#                         GET   /api/programme/plan · POST /api/programme/apply
#                         PATCH /api/programme/items/:id, /api/programme/projects/:id
#                         GET   /api/item-status/plan
#                         GET   /api/item-bic/plan
#   sync-snapshots        scheduled, every 5 minutes
#   sync-full-background  nightly / first-run full rebuild
#   item-status*          Item & Drawing Status automation (legacy functions, kept as-is)

# Item & Drawing Status automation (PRs #5–#10): manual run / dry run with STATUS_SECRET.
# item-status-nightly runs on its own schedule (config in the function).
[[redirects]]
  from   = "/api/item-status"
  to     = "/.netlify/functions/item-status"
  status = 200

# ── SPA fallback ──────────────────────────────────────────────────────────────
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
