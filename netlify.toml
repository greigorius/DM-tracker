[build]
  command = "npm run build"
  publish = "dist"

[functions]
  node_bundler = "esbuild"

# ── API rewrites → Netlify Functions ─────────────────────────────────────────
[[redirects]]
  from   = "/api/projects/:id/items"
  to     = "/.netlify/functions/project-items"
  status = 200

[[redirects]]
  from   = "/api/projects/:id/timeline"
  to     = "/.netlify/functions/project-timeline"
  status = 200

[[redirects]]
  from   = "/api/projects/:id/drawings"
  to     = "/.netlify/functions/project-drawings"
  status = 200

[[redirects]]
  from   = "/api/projects"
  to     = "/.netlify/functions/projects"
  status = 200

[[redirects]]
  from   = "/api/stats"
  to     = "/.netlify/functions/stats"
  status = 200

[[redirects]]
  from   = "/api/rfis"
  to     = "/.netlify/functions/rfis"
  status = 200

[[redirects]]
  from   = "/api/tdl"
  to     = "/.netlify/functions/tdl"
  status = 200

[[redirects]]
  from   = "/api/quick-log/todo"
  to     = "/.netlify/functions/quick-log-todo"
  status = 200

[[redirects]]
  from   = "/api/quick-log/rfi"
  to     = "/.netlify/functions/quick-log-rfi"
  status = 200

[[redirects]]
  from   = "/api/quick-log/production"
  to     = "/.netlify/functions/quick-log-production"
  status = 200

[[redirects]]
  from   = "/api/tasks/update"
  to     = "/.netlify/functions/task-update"
  status = 200

[[redirects]]
  from   = "/api/tasks"
  to     = "/.netlify/functions/tasks"
  status = 200

[[redirects]]
  from   = "/api/task-categories"
  to     = "/.netlify/functions/task-categories"
  status = 200

[[redirects]]
  from   = "/api/drawings-register/update"
  to     = "/.netlify/functions/drawings-register-update"
  status = 200

[[redirects]]
  from   = "/api/drawings-register/bulk"
  to     = "/.netlify/functions/drawings-register-bulk"
  status = 200

[[redirects]]
  from   = "/api/drawings-register/items"
  to     = "/.netlify/functions/drawings-register-items"
