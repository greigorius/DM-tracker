[build]
  command = "npm run build"
  publish = "dist"

[functions]
  node_bundler = "esbuild"

# Hub functions declare their own paths (config.path), so no API redirects:
#   api-read              GET   /api/snapshot, /api/bootstrap
#   api-write             POST  /api/actions, /api/rfis, /api/variations, /api/sync-now,
#                               /api/records/:db/:id/trash|restore
#                         PATCH /api/items/:id, /api/records/:db/:id
#   sync-snapshots        scheduled, every 5 minutes
#   sync-full-background  nightly / first-run full rebuild

# ── SPA fallback ──────────────────────────────────────────────────────────────
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
